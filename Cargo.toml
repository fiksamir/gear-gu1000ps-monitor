[package]
name = "gear-ups"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Monitor and power-off helper for GEAR GU-1000PS (MEC0003, Megatec over USB HID)"

[lib]
name = "gear_ups"
path = "src/lib.rs"

[[bin]]
name = "gear-ups"
path = "src/main.rs"

[[bin]]
name = "gear-ups-gui"
path = "src/gui/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
windows-service = "0.7"
eframe = "0.36"
tray-icon = "0.26"
egui_plot = "0.37"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_Shutdown",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
]

[profile.release]
lto = true
